[project]
name = "machine_learning"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Oskar", email = "oskar.kloepfer@gmx.de"},
]
dependencies = ["numpy>=2.4.6", "ipykernel>=7.2.0", "matplotlib>=3.10.9", "opencv-python>=4.13.0.92", "gymnasium>=1.3.0", "imageio>=2.37.3", "stable-baselines3[extra]>=2.0.0a5", "pytest>=9.0.3"]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
app = "streamlit run streamlit_app/app.py"
backend = "uvicorn streamlit_app.backend:app --host 127.0.0.1 --port 8000"

[dependency-groups]
dev = [
    "streamlit>=1.58.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "requests>=2.32.0",
]
